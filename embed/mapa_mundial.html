<!DOCTYPE html>
<html lang="es" data-theme="light" style="--acento:#0A9396">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa Mundial de Libertad Económica · Populi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="comun/monitor.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="comun/monitor.js"></script>
  <style>
    /* ── Mapa: el lienzo toma el alto del mapa (no el alto fijo del molde), así no quedan franjas vacías ── */
    .mapa-caja { position: relative; }
    .grafico.mapa { height: auto; aspect-ratio: 2.2; }
    .ley .lp.area { --pc: var(--k); }
    .vista {
      position: absolute; top: 6px; right: 6px; display: none; align-items: center; gap: 6px; padding: 5px 9px;
      border: 1px solid var(--border); border-radius: var(--r-s); background: var(--card); color: var(--muted); cursor: pointer;
      font: 600 .62rem/1.2 'Inter', sans-serif; transition: color .2s, border-color .2s;
    }
    .vista.ver { display: inline-flex; }
    .vista:hover { color: var(--tinta); border-color: var(--tinta); }
    .vista svg { width: 11px; height: 11px; }
    .aviso {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: none; opacity: 0;
      padding: 8px 13px; background: rgba(0, 18, 25, .86); color: #fff; border-top: 2px solid var(--acento);
      font: 500 .7rem/1.35 'Inter', sans-serif; white-space: nowrap; transition: opacity .25s;
    }
    .aviso.ver { opacity: 1; }

    /* ── Línea de tiempo: animar y deslizar por los años ── */
    .linea-t { display: flex; align-items: center; gap: 12px; padding: 10px 0 4px; margin-top: 4px; border-top: 1px solid var(--border); }
    .play {
      flex: none; width: 34px; height: 34px; display: grid; place-items: center; padding: 0; border: 0; border-radius: var(--r-s);
      background: var(--acento); color: #fff; cursor: pointer; transition: filter .2s, transform .12s;
      box-shadow: 0 1px 2px rgba(0, 18, 25, .2), 0 4px 12px -6px rgba(0, 18, 25, .45);
    }
    .play:hover { filter: brightness(1.1); }
    .play:active { transform: scale(.95); }
    .play svg { width: 13px; height: 13px; }
    .anio { flex: none; min-width: 3.1ch; font: 700 1.35rem/1 'JetBrains Mono', monospace; letter-spacing: -.02em; color: var(--tinta); font-variant-numeric: tabular-nums; }
    .pista { --t: 16px; position: relative; flex: 1; min-width: 0; padding-bottom: 15px; }
    .pista input { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 26px; margin: 0; background: transparent; cursor: pointer; }
    .pista input:focus-visible { outline: none; }
    .pista input::-webkit-slider-runnable-track { height: 4px; background: linear-gradient(to right, var(--acento) var(--p, 100%), var(--border) var(--p, 100%)); }
    .pista input::-moz-range-track { height: 4px; background: linear-gradient(to right, var(--acento) var(--p, 100%), var(--border) var(--p, 100%)); }
    .pista input::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none; width: var(--t); height: var(--t); margin-top: calc(2px - var(--t) / 2);
      border: 3px solid var(--acento); border-radius: 0; background: var(--card); box-shadow: 0 1px 3px rgba(0, 18, 25, .3); transition: box-shadow .2s;
    }
    .pista input::-moz-range-thumb { width: var(--t); height: var(--t); box-sizing: border-box; border: 3px solid var(--acento); border-radius: 0; background: var(--card); box-shadow: 0 1px 3px rgba(0, 18, 25, .3); }
    .pista input:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px var(--card), 0 0 0 5px var(--acento); }
    .pista input:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 3px var(--card), 0 0 0 5px var(--acento); }
    .marcas { position: absolute; left: 0; right: 0; bottom: 0; height: 15px; pointer-events: none; }
    .marcas i { position: absolute; top: 0; width: 1px; height: 3px; background: var(--tenue); }
    .marcas span { position: absolute; top: 3px; transform: translateX(-50%); font: 500 .58rem/1.2 'JetBrains Mono', monospace; color: var(--muted); white-space: nowrap; }

    /* ── Cifras con nombre de país ── */
    .kv-nom { display: block; overflow: hidden; text-overflow: ellipsis; font: 700 1.02rem/1.35 'Inter', sans-serif; letter-spacing: 0; }

    /* ── Ranking del panel (dos columnas) y áreas de Bolivia ── */
    .rk { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 16px; }
    .rk-l { list-style: none; margin-top: 4px; }
    .rk-l li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: baseline; gap: 6px; padding: 3px 4px 3px 0; border-bottom: 1px solid var(--border); font-size: .7rem; line-height: 1.35; }
    .rk-l li:last-child { border-bottom: 0; }
    .rk-n { font: 500 .6rem/1 'JetBrains Mono', monospace; color: var(--muted); text-align: right; }
    .rk-p { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--tinta); }
    .rk-v { font: 600 .66rem/1 'JetBrains Mono', monospace; }
    .rk-l li.bol { background: var(--crema); }
    .rk-l li.bol .rk-p { font-weight: 700; }
    .ar { margin-top: 7px; }
    .ar-f { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 3px 10px; margin-top: 6px; font-size: .66rem; line-height: 1.3; }
    .ar-n { color: var(--muted); }
    .ar-v { font: 600 .66rem/1 'JetBrains Mono', monospace; }
    .ar-b { grid-column: 1 / -1; position: relative; height: 4px; background: var(--suave); }
    .ar-b i { position: absolute; left: 0; top: 0; bottom: 0; }
    .ar-b b { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--tinta); opacity: .6; }
    .ar-ley { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font: 500 .6rem/1.3 'Inter', sans-serif; color: var(--muted); }
    .ar-ley span { display: inline-flex; align-items: center; gap: 5px; }
    .ar-ley i { width: 10px; height: 4px; }
    .ar-ley b { width: 2px; height: 10px; background: var(--tinta); opacity: .6; }

    /* ── Tooltip: filas de áreas con barra (0 a 10) ── */
    .tt-sec { font: 700 9.5px/1.3 'Inter', sans-serif; letter-spacing: .08em; text-transform: uppercase; color: rgba(255, 255, 255, .5); margin: 8px 0 0; }
    .tt-a .tt-b { flex: none; position: relative; width: 44px; height: 4px; margin-left: 12px; background: rgba(255, 255, 255, .14); }
    .tt-a .tt-b i { position: absolute; left: 0; top: 0; bottom: 0; }
    .tt-a .tt-v { margin-left: 8px; min-width: 2.1em; text-align: right; }
    .tt-sd { font: 500 11px/1.4 'Inter', sans-serif; color: rgba(255, 255, 255, .72); }

    @media (max-width: 640px) {
      .linea-t { gap: 10px; padding-top: 12px; }
      .play { width: 42px; height: 42px; }
      .play svg { width: 15px; height: 15px; }
      .anio { font-size: 1.2rem; }
      .pista { --t: 24px; }
      .pista input { height: 34px; }
      .rk { gap: 0 12px; }
      .rk-l li { grid-template-columns: 20px minmax(0, 1fr) auto; gap: 5px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="sec-hd">
      <div class="sec-title"><span class="accent-bar"></span>Mapa Mundial de Libertad Económica</div>
      <div class="sec-sub" id="bajada">Índice Economic Freedom of the World (EFW) del Fraser Institute, de 0 (menos libre) a 10 (más libre)</div>
    </div>

    <div class="kpi-grid" id="kpis"></div>

    <div class="main-grid">
      <div class="chart-card">
        <div class="chart-ctrl"><div class="ley" id="leyenda"></div></div>
        <div class="mapa-caja">
          <div class="grafico mapa" id="chart"><div class="loading"><div class="spinner"></div><span>Cargando el mapa…</span></div></div>
          <button type="button" class="vista" id="vista" title="Volver al mapa completo">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8a5.5 5.5 0 1 0 1.6-3.9M2.5 2.5v3h3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>Vista completa
          </button>
          <div class="aviso" id="aviso" aria-hidden="true">Ctrl + rueda para acercar el mapa (⌘ en Mac)</div>
        </div>
        <div class="linea-t">
          <button type="button" class="play" id="play" aria-label="Animar de 1950 a 2023"></button>
          <div class="anio" id="anio" aria-live="polite"></div>
          <div class="pista">
            <input type="range" id="rango" min="0" max="1" step="1" value="1" aria-label="Año del mapa" />
            <div class="marcas" id="marcas"></div>
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-hd"><span class="panel-hd-t">Ranking del año</span><span class="panel-hd-d" id="panel-fecha"></span></div>
        <div class="panel-body" id="panel"></div>
      </div>
    </div>

    <div class="edu-grid" id="preguntas"></div>
    <div class="source"><span class="source-txt" id="fuente"></span></div>
  </div>

  <script>
  (function () {
    var C = PM.C;
    // Cuartiles DE CADA AÑO (cuatro grupos de igual tamaño según el puesto, los cortes salen del dato
    // de ese año): escala ORDINAL de la marca, la misma de las dispersiones
    var QC = { 1: C.turquesa, 2: C.menta, 3: C.oro, 4: C.rojo };
    var QN = { 1: 'Cuartil 1 · más libre', 2: 'Cuartil 2', 3: 'Cuartil 3', 4: 'Cuartil 4 · menos libre' };
    var AREAS = [['Tamaño del gobierno', 'Tamaño del gobierno'], ['Sistema legal y derechos de propiedad', 'Sistema legal y propiedad'],
      ['Moneda sana', 'Moneda sana'], ['Libertad para comerciar internacionalmente', 'Comercio internacional'], ['Regulación', 'Regulación']];
    var REGION = { 'Latin America & the Caribbean': 'América Latina y el Caribe', 'North America': 'Norteamérica',
      'Europe & Central Asia': 'Europa y Asia Central', 'East Asia & Pacific': 'Asia Oriental y Pacífico', 'South Asia': 'Asia del Sur',
      'Middle East & North Africa': 'Medio Oriente y Norte de África', 'Sub-Saharan Africa': 'África Subsahariana' };
    // El mapa base (world.json) no dibuja aparte a Hong Kong ni a Taiwán: van como punto en estas coordenadas
    var SIN_POLIGONO = { HKG: [114.17, 22.32], TWN: [120.96, 23.7] };
    var CHICO = 0.5;            // área proyectada (grados²) bajo la cual un país no se distingue: va como punto

    // Proyección Natural Earth (polinomio de Šavrič et al.), la misma del mapa anterior
    var RAD = Math.PI / 180;
    var PROY = {
      project: function (p) {
        var lam = p[0] * RAD, phi = p[1] * RAD, phi2 = phi * phi, phi4 = phi2 * phi2;
        return [lam * (0.8707 - 0.131979 * phi2 + phi4 * (-0.013791 + phi4 * (0.003971 * phi2 - 0.001529 * phi4))) / RAD,
          -(phi * (1.007226 + phi2 * (0.015085 + phi4 * (-0.044475 + 0.028874 * phi2 - 0.005916 * phi4))) / RAD)];
      },
      unproject: function (p) {
        var x = p[0] * RAD, y = -p[1] * RAD, phi = y, phi2, phi4;
        for (var i = 0; i < 10; i++) {
          phi2 = phi * phi; phi4 = phi2 * phi2;
          var f = phi * (1.007226 + phi2 * (0.015085 + phi4 * (-0.044475 + 0.028874 * phi2 - 0.005916 * phi4))) - y;
          var df = 1.007226 + phi2 * (3 * 0.015085 + phi4 * (-7 * 0.044475 + 9 * 0.028874 * phi2 - 11 * 0.005916 * phi4));
          phi -= f / df;
        }
        phi2 = phi * phi; phi4 = phi2 * phi2;
        return [x / (0.8707 - 0.131979 * phi2 + phi4 * (-0.013791 + phi4 * (0.003971 * phi2 - 0.001529 * phi4))) / RAD, phi / RAD];
      }
    };

    var PANEL, META, ES, EN, MAPA_ISO, ANIOS, ISO_GEO = {}, PUNTOS = [], ASPECTO = 2.2, cache = {};
    var estado = { anio: null, jugando: false }, reloj = 0, grafico, aviso = 0;

    var nombre = function (iso) { return ES[iso] || (META[iso] && META[iso].name) || iso; };
    // «sin dato»: en claro, un gris más claro que la niebla #DFE5EA, que se confundía con el cuartil 2
    // (menta: ΔE 12,3 con visión normal; con #ECEFF1, 15,1 y 11,5 en protanopía, validate_palette.js)
    var niebla = function () { return PM.dk() ? '#242C30' : '#ECEFF1'; };
    var media = function (a) { return a.length ? a.reduce(function (s, v) { return s + v; }, 0) / a.length : null; };
    // promedios a dos decimales con la mitad hacia arriba sobre el decimal exacto (en binario 6,035 es 6,03499…)
    var r2 = function (v) { return v == null ? null : Math.round(v * 100 + 1e-7) / 100; };

    // ── Geometría: área y centro de cada país, relación de aspecto del mapa ───────────────────
    function prepararMapa(geo) {
      var X0 = Infinity, X1 = -Infinity, Y0 = Infinity, Y1 = -Infinity, info = {};
      geo.features.forEach(function (f) {
        var g = f.geometry, polys = g.type === 'Polygon' ? [g.coordinates] : g.coordinates, area = 0, mayor = null, am = -1;
        polys.forEach(function (poly) {
          if (!poly || !poly[0] || poly[0].length < 3) return;
          var pts = poly[0].map(PROY.project), a = 0;
          for (var i = 0; i < pts.length - 1; i++) a += pts[i][0] * pts[i + 1][1] - pts[i + 1][0] * pts[i][1];
          a = Math.abs(a) / 2; area += a;
          if (a > am) { am = a; mayor = poly[0]; }
          poly.forEach(function (anillo) {
            anillo.forEach(function (c) { var p = PROY.project(c); X0 = Math.min(X0, p[0]); X1 = Math.max(X1, p[0]); Y0 = Math.min(Y0, p[1]); Y1 = Math.max(Y1, p[1]); });
          });
        });
        var iso = MAPA_ISO[f.properties.name];
        if (!iso || !mayor) return;
        var lo = mayor.map(function (c) { return c[0]; }), la = mayor.map(function (c) { return c[1]; });
        var i0 = info[iso] || (info[iso] = { area: 0 });
        i0.area += area;
        if (!i0.centro || area > i0.am) { i0.am = area; i0.centro = [(Math.min.apply(null, lo) + Math.max.apply(null, lo)) / 2, (Math.min.apply(null, la) + Math.max.apply(null, la)) / 2]; }
        ISO_GEO[iso] = f.properties.name;
      });
      ASPECTO = (X1 - X0) / (Y1 - Y0);
      // los países del índice que no se verían (o que el mapa base no dibuja) van como punto
      var todos = {};
      ANIOS.forEach(function (a) { Object.keys(PANEL[a]).forEach(function (iso) { todos[iso] = 1; }); });
      Object.keys(todos).sort().forEach(function (iso) {
        if (SIN_POLIGONO[iso]) PUNTOS.push({ iso: iso, c: SIN_POLIGONO[iso] });
        else if (!info[iso]) console.warn('Sin geometría ni punto para', iso);
        else if (info[iso].area < CHICO) PUNTOS.push({ iso: iso, c: info[iso].centro });
      });
    }

    // ── Dato de un año: puesto (con empates), cuartil y promedios ──────────────────────────────
    function datos(a) {
      if (cache[a]) return cache[a];
      var d = PANEL[a] || {}, filas = [];
      Object.keys(d).forEach(function (iso) {
        var v = d[iso];
        if (v && v.s != null) filas.push({ iso: iso, s: v.s, ar: [v.a1, v.a2, v.a3, v.a4, v.a5] });
      });
      filas.sort(function (x, y) { return y.s - x.s || (x.iso < y.iso ? -1 : 1); });
      var n = filas.length, porIso = {}, rq = {};
      filas.forEach(function (f, i) {
        // puesto 1-2-2-4: uno más que los que puntúan estrictamente más alto
        f.puesto = i > 0 && f.s === filas[i - 1].s ? filas[i - 1].puesto : i + 1;
        // cuartil: cuatro grupos de igual tamaño por puesto (si el total no es múltiplo de 4, el último tiene uno más)
        f.q = Math.min(4, Math.ceil(f.puesto * 4 / n));
        porIso[f.iso] = f;
        var r = rq[f.q] || (rq[f.q] = [f.s, f.s]);
        r[0] = Math.min(r[0], f.s); r[1] = Math.max(r[1], f.s);
      });
      var mediaArea = [0, 1, 2, 3, 4].map(function (k) {
        return media(filas.map(function (f) { return f.ar[k]; }).filter(function (v) { return v != null; }));
      });
      return (cache[a] = { a: a, filas: filas, n: n, porIso: porIso, rq: rq, mediaArea: mediaArea,
        media: media(filas.map(function (f) { return f.s; })) });
    }

    PM.cargar(['efw_panel_map.json', 'efw_country_meta.json', 'world.json', 'paises_es.json']).then(function (r) {
      PANEL = r[0]; META = r[1]; ES = r[3].iso; EN = r[3].en; MAPA_ISO = r[3].mapa_iso;
      ANIOS = Object.keys(PANEL).map(Number).sort(function (a, b) { return a - b; });
      estado.anio = ANIOS[ANIOS.length - 1];
      prepararMapa(r[2]);
      echarts.registerMap('world', r[2]);
      var el = document.getElementById('chart');
      el.style.aspectRatio = (ASPECTO * 0.97).toFixed(3);
      PM.imagen = { aspecto: ASPECTO * 0.97 };   // la imagen de descarga, con el aspecto del mapa (sin franjas vacías)
      el.innerHTML = '';
      leyenda(); textos(); lineaTiempo(); guardas(el);
      grafico = PM.montar(el, opciones);
      grafico.chart.on('georoam', function () { document.getElementById('vista').classList.add('ver'); });
      PM.alCambiarTema(function () { leyenda(); textos(); pintarPista(); });
      PM.preguntas(document.getElementById('preguntas'), preguntas());
      document.getElementById('fuente').innerHTML = 'Fuente: <a href="https://www.fraserinstitute.org/economic-freedom" target="_blank" rel="noopener">Fraser Institute</a>, Economic Freedom of the World ' + (ANIOS[ANIOS.length - 1] + 2) + ' · Elaboración: Centro de Estudios POPULI';
    }).catch(function (e) { console.error(e); PM.error(document.getElementById('chart')); });

    // ── Año en pantalla: cifras, panel, bajada y colores del mapa (sin perder el acercamiento) ──
    function ponerAnio(a) {
      if (a === estado.anio) return;
      estado.anio = a;
      textos(); pintarPista();
      var ch = grafico && grafico.chart, o = ch && ch.getOption();
      if (o && o.geo && o.geo.length) {
        var D = datos(a);
        ch.setOption({ geo: [{ regions: regiones(D) }], series: [{ data: puntos(D) }] });
      }
    }
    function textos() {
      var D = datos(estado.anio);
      document.getElementById('anio').textContent = estado.anio;
      document.getElementById('panel-fecha').textContent = estado.anio;
      document.getElementById('bajada').textContent = 'Índice Economic Freedom of the World (EFW) del Fraser Institute en ' + estado.anio +
        ', de 0 (menos libre) a 10 (más libre) · ' + D.n + ' jurisdicciones';
      cifras(D); panel(D);
    }

    function leyenda() {
      document.getElementById('leyenda').innerHTML = [1, 2, 3, 4].map(function (q) {
        return '<span class="ley-i"><span class="lp area" style="--k:' + PM.col(QC[q]) + '"></span>' + QN[q] + '</span>';
      }).join('') + '<span class="ley-i"><span class="lp area" style="--k:' + niebla() + '"></span>Sin dato</span>';
    }

    function cifras(D) {
      var i = ANIOS.indexOf(estado.anio), hasta = ANIOS.slice(0, i + 1);
      var top = D.filas[0], bot = D.filas[D.n - 1], bol = D.porIso.BOL;
      var empate = D.filas[1] && D.filas[1].puesto === 1;
      document.getElementById('kpis').innerHTML =
        PM.kpi({ color: C.pizarra, rotulo: 'Promedio mundial', valor: PM.num(r2(D.media), 2), delta: D.n + ' jurisdicciones', tono: 'neutro',
          serie: hasta.map(function (a) { return datos(a).media; }) }) +
        PM.kpi({ color: C.turquesa, rotulo: 'Más libre', valor: '<span class="kv-nom">' + nombre(top.iso) + '</span>',
          delta: PM.num(top.s, 2) + (empate ? ' · empate en el 1.º' : ' · puesto 1'), tono: 'neutro' }) +
        PM.kpi({ color: C.rojo, rotulo: 'Menos libre', valor: '<span class="kv-nom">' + nombre(bot.iso) + '</span>',
          delta: PM.num(bot.s, 2) + ' · puesto ' + bot.puesto, tono: 'neutro' }) +
        PM.kpi({ color: bol ? QC[bol.q] : C.gris, rotulo: 'Bolivia', valor: bol ? PM.num(bol.s, 2) : '—',
          delta: bol ? 'puesto ' + bol.puesto + ' de ' + D.n : 'sin dato en ' + estado.anio, tono: 'neutro',
          serie: hasta.map(function (a) { var f = datos(a).porIso.BOL; return f ? f.s : null; }) });
    }

    function rotulo(color, txt) {
      return '<div class="pb-lbl" style="color:' + PM.tx(color) + ';background:' + PM.rgba(color, PM.dk() ? 0.16 : 0.08) +
        ';border-left-color:' + PM.col(color) + '">' + txt + '</div>';
    }
    function lista(fs) {
      return '<ol class="rk-l">' + fs.map(function (f) {
        return '<li' + (f.iso === 'BOL' ? ' class="bol"' : '') + '><span class="rk-n">' + f.puesto + '</span><span class="rk-p" title="' + nombre(f.iso) + '">' +
          nombre(f.iso) + '</span><span class="rk-v" style="color:' + PM.tx(QC[f.q]) + '">' + PM.num(f.s, 2) + '</span></li>';
      }).join('') + '</ol>';
    }
    function panel(D) {
      var bol = D.porIso.BOL, html = '<div class="pb"><div class="rk"><div>' + rotulo(C.turquesa, 'Las 10 más libres') + lista(D.filas.slice(0, 10)) +
        '</div><div>' + rotulo(C.rojo, 'Las 10 menos libres') + lista(D.filas.slice(-10)) + '</div></div></div>';
      if (bol) {
        var c = QC[bol.q], r = D.rq[bol.q];
        var desc = 'Puesto <strong>' + bol.puesto + ' de ' + D.n + '</strong>, en el cuartil ' + bol.q + ' (de ' + PM.num(r[0], 2) + ' a ' + PM.num(r[1], 2) + ').';
        var filas = AREAS.map(function (ar, k) {
          var v = bol.ar[k], m = D.mediaArea[k];
          if (v == null) return '';
          return '<div class="ar-f"><span class="ar-n">' + ar[0] + '</span><span class="ar-v" style="color:' + PM.tx(c) + '">' + PM.num(v, 2) + '</span>' +
            '<span class="ar-b"><i style="width:' + v * 10 + '%;background:' + PM.col(c) + '"></i>' +
            (m != null ? '<b style="left:' + m * 10 + '%" title="Promedio mundial: ' + PM.num(r2(m), 2) + '"></b>' : '') + '</span></div>';
        }).join('');
        var pie = filas ? '<div class="ar">' + filas + '</div><div class="ar-ley"><span><i style="background:' + PM.col(c) + '"></i>Bolivia</span>' +
          '<span><b></b>Promedio de las ' + D.n + ' jurisdicciones</span></div>' : '<p class="pb-desc">Sin desglose por áreas en ' + estado.anio + ': antes de 1970 la serie trae sólo el índice general.</p>';
        html += PM.pb(c, 'Bolivia en ' + estado.anio, PM.num(bol.s, 2), desc).replace(/<\/div>$/, pie + '</div>');
      } else html += PM.pb(C.gris, 'Bolivia en ' + estado.anio, null, 'Sin dato para Bolivia en este año.');
      html += PM.ctx('<strong>Escala:</strong> de 0 (menos libre) a 10 (más libre). Cada color reúne a una cuarta parte de las jurisdicciones medidas en el año. ' +
        'Van como punto los territorios muy chicos para verse a esta escala (Singapur, Malta, Luxemburgo…) y los que el mapa base no dibuja aparte (Hong Kong, Taiwán).');
      document.getElementById('panel').innerHTML = html;
    }

    // ── Mapa ───────────────────────────────────────────────────────────────────────────────
    function regiones(D) {
      var r = D.filas.filter(function (f) { return ISO_GEO[f.iso]; }).map(function (f) {
        return { name: ISO_GEO[f.iso], itemStyle: { areaColor: PM.col(QC[f.q]) } };
      });
      r.push({ name: '', silent: true });          // trazos sin nombre del mapa base (Cachemira)
      return r;
    }
    function puntos(D) {
      return PUNTOS.filter(function (p) { return D.porIso[p.iso]; }).map(function (p) {
        return { name: p.iso, iso: p.iso, value: p.c, itemStyle: { color: PM.col(QC[D.porIso[p.iso].q]) } };
      });
    }
    function filaArea(txt, v, color) {
      return '<div class="tt-f tt-a"><span class="tt-n">' + txt + '</span><span class="tt-b"><i style="width:' + v * 10 + '%;background:' + PM.col(color) + '"></i></span>' +
        '<span class="tt-v" style="color:#fff">' + PM.num(v, 1) + '</span></div>';
    }
    function tip(p) {
      var iso = p.componentType === 'geo' ? MAPA_ISO[p.name] : (p.data && p.data.iso);
      var D = datos(estado.anio), f = iso ? D.porIso[iso] : null, a = estado.anio;
      var nom = iso ? nombre(iso) : (EN[p.name] || p.name);
      if (!nom) return '';
      if (!f) return PM.ttTitulo(nom) + '<div class="tt-sd">Sin dato en ' + a + '</div>';
      var reg = META[iso] ? REGION[META[iso].region] : '', r = D.rq[f.q], corto = PM.pequeno(), faltan = 0;
      var h = PM.ttTitulo(nom, reg) + PM.ttFila(QC[f.q], 'Índice EFW ' + a, PM.num(f.s, 2), 'area') + PM.ttFila(null, 'Puesto', f.puesto + ' de ' + D.n);
      var areas = AREAS.map(function (ar, k) { if (f.ar[k] == null) { faltan++; return ''; } return filaArea(ar[corto ? 1 : 0], f.ar[k], QC[f.q]); }).join('');
      if (areas) h += '<div class="tt-sec">Áreas (0 a 10)</div>' + areas;
      return h + PM.ttPie(QN[f.q] + ': de ' + PM.num(r[0], 2) + ' a ' + PM.num(r[1], 2) + ' en ' + a +
        (!areas ? ' · sin desglose por áreas' : faltan ? ' · ' + faltan + (faltan > 1 ? ' áreas' : ' área') + ' sin dato' : ''));
    }
    // En el teléfono el mapa es bajo: la ficha va DEBAJO del lienzo (sobre la línea de tiempo) y deja ver el país tocado
    function abajo(pt, params, dom, rect, size) {
      var w = size.contentSize[0], W = size.viewSize[0];
      return [Math.min(Math.max(pt[0] - w / 2, 4), Math.max(4, W - w - 4)), size.viewSize[1] + 6];
    }
    function opciones() {
      var dk = PM.dk(), chico = PM.pequeno(), el = document.getElementById('chart'), D = datos(estado.anio);
      var W = el.clientWidth || 600, H = el.clientHeight || W / ASPECTO, card = PM.var('--card') || '#fff';
      var borde = dk ? '#F1F5F9' : '#001219';
      return {
        geo: {
          map: 'world', projection: PROY, roam: !chico, scaleLimit: { min: 1, max: 10 },
          layoutCenter: ['50%', '50%'], layoutSize: Math.min(W * 0.99, (H - 4) * ASPECTO),
          itemStyle: { areaColor: niebla(), borderColor: card, borderWidth: chico ? 0.35 : 0.5 },
          // al pasar, el país conserva su color y se marca su contorno
          emphasis: { label: { show: false }, itemStyle: { areaColor: null, color: null, borderColor: borde, borderWidth: 1 } },
          select: { disabled: true }, label: { show: false },
          regions: regiones(D),
          tooltip: { show: true, formatter: tip }
        },
        tooltip: PM.tooltip(tip, chico ? { trigger: 'item', confine: false, position: abajo } : { trigger: 'item' }),
        series: [{
          type: 'scatter', coordinateSystem: 'geo', data: puntos(D), symbolSize: chico ? 6 : 7, z: 3, animation: false,
          itemStyle: { borderColor: card, borderWidth: 1, opacity: 1 },
          emphasis: { scale: 1.5, itemStyle: { borderColor: borde, borderWidth: 1 } }
        }]
      };
    }

    // Rueda: el mapa se acerca sólo con Ctrl (o ⌘); sin tecla, la página se desplaza como siempre
    // (antes el mapa atrapaba el desplazamiento). En el teléfono el mapa no se arrastra: la página baja con el dedo.
    function guardas(el) {
      var caja = el.parentNode;
      ['wheel', 'mousewheel'].forEach(function (tipo) {
        caja.addEventListener(tipo, function (e) {
          if (PM.pequeno() || e.ctrlKey || e.metaKey) return;
          e.stopPropagation();
          if (tipo === 'wheel') {
            var av = document.getElementById('aviso');
            av.classList.add('ver'); clearTimeout(aviso);
            aviso = setTimeout(function () { av.classList.remove('ver'); }, 1300);
          }
        }, { capture: true, passive: true });
      });
      document.getElementById('vista').addEventListener('click', function () {
        this.classList.remove('ver');
        grafico.redibujar();
      });
      // un toque fuera del mapa cierra la ficha (en el teléfono queda sobre la línea de tiempo)
      document.addEventListener('touchstart', function (e) {
        if (grafico && !el.contains(e.target)) grafico.chart.dispatchAction({ type: 'hideTip' });
      }, { passive: true });
    }

    // ── Línea de tiempo ──────────────────────────────────────────────────────────────────────
    var ICONO_PLAY = '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5v11l9-5.5z" fill="currentColor"/></svg>';
    var ICONO_PAUSA = '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5h3v11H3zM8 1.5h3v11H8z" fill="currentColor"/></svg>';
    function lineaTiempo() {
      var r = document.getElementById('rango'), b = document.getElementById('play');
      r.max = ANIOS.length - 1; r.value = ANIOS.indexOf(estado.anio);
      r.addEventListener('input', function () { parar(); ponerAnio(ANIOS[+r.value]); });
      b.addEventListener('click', function () { if (estado.jugando) parar(); else jugar(); });
      boton();
      if (window.ResizeObserver) new ResizeObserver(function () { marcas(); pintarPista(); }).observe(r);
      marcas(); pintarPista();
    }
    function boton() {
      var b = document.getElementById('play');
      b.innerHTML = estado.jugando ? ICONO_PAUSA : ICONO_PLAY;
      b.setAttribute('aria-label', estado.jugando ? 'Pausar la animación' : 'Animar de ' + ANIOS[0] + ' a ' + ANIOS[ANIOS.length - 1]);
      b.title = estado.jugando ? 'Pausar' : 'Animar ' + ANIOS[0] + '–' + ANIOS[ANIOS.length - 1];
      document.getElementById('anio').setAttribute('aria-live', estado.jugando ? 'off' : 'polite');   // sin anunciar cada cuadro
    }
    function jugar() {
      if (ANIOS.indexOf(estado.anio) >= ANIOS.length - 1) ponerAnio(ANIOS[0]);
      estado.jugando = true; boton();
      reloj = setInterval(function () {
        var i = ANIOS.indexOf(estado.anio) + 1;
        if (i >= ANIOS.length) { parar(); return; }
        ponerAnio(ANIOS[i]);
        if (i === ANIOS.length - 1) parar();
      }, 650);
    }
    function parar() { if (!estado.jugando) return; estado.jugando = false; clearInterval(reloj); boton(); }
    // posición del centro del cursor para el año i (el cursor no sale de la pista)
    function pos(i, ancho, t) { return t / 2 + i / (ANIOS.length - 1) * (ancho - t); }
    function grosor() { return parseFloat(getComputedStyle(document.querySelector('.pista')).getPropertyValue('--t')) || 16; }
    function pintarPista() {
      var r = document.getElementById('rango'), i = ANIOS.indexOf(estado.anio);
      if (+r.value !== i) r.value = i;
      r.setAttribute('aria-valuetext', String(estado.anio));
      r.style.setProperty('--p', pos(i, r.clientWidth || 1, grosor()) + 'px');
    }
    function marcas() {
      var r = document.getElementById('rango'), W = r.clientWidth, t = grosor(), el = document.getElementById('marcas');
      if (!W) return;
      var html = ANIOS.map(function (a, i) { return '<i style="left:' + pos(i, W, t).toFixed(1) + 'px"></i>'; }).join('');
      // rótulos: los extremos primero (sin salirse de la pista), después los que entren sin pisarse
      var ancho = 26, puestos = [];
      [ANIOS[0], ANIOS[ANIOS.length - 1], 2000, 1970, 2010, 1990].forEach(function (a) {
        var i = ANIOS.indexOf(a); if (i < 0) return;
        var x = Math.min(Math.max(pos(i, W, t), ancho / 2), W - ancho / 2);
        if (puestos.some(function (p) { return Math.abs(p - x) < ancho + 10; })) return;
        puestos.push(x); html += '<span style="left:' + x.toFixed(1) + 'px">' + a + '</span>';
      });
      el.innerHTML = html;
    }

    // ── Descargas: la leyenda de la imagen y la tabla del año mostrado ─────────────────────────
    PM.leyendaImagen = function () {
      return [1, 2, 3, 4].map(function (q) { return { name: QN[q], color: PM.col(QC[q]), forma: 'area' }; })
        .concat([{ name: 'Sin dato', color: niebla(), forma: 'area' }]);
    };
    PM.tablaDatos = function () {
      var D = datos(estado.anio);
      return {
        cols: ['País', 'ISO3', 'Región', 'Índice EFW ' + estado.anio, 'Puesto', 'Cuartil'].concat(AREAS.map(function (a) { return a[0]; })),
        filas: D.filas.map(function (f) {
          return [nombre(f.iso), f.iso, META[f.iso] ? REGION[META[f.iso].region] : '', f.s, f.puesto, f.q].concat(f.ar);
        })
      };
    };

    function preguntas() {
      var U = ANIOS[ANIOS.length - 1], D = datos(U), rq = D.rq;
      var cob = [ANIOS[0], 1970, 2000, U].filter(function (a) { return PANEL[a]; })
        .map(function (a) { return '<strong>' + datos(a).n + '</strong> en ' + a; });
      var sinAreas = ANIOS.filter(function (a) { return !datos(a).filas.some(function (f) { return f.ar.some(function (v) { return v != null; }); }); });
      return [
        ['¿Qué mide el índice de libertad económica?', 'El índice <strong>Economic Freedom of the World</strong> (EFW), que publica cada año el Fraser Institute, califica de 0 a 10 a hasta 165 jurisdicciones con <strong>45 componentes</strong> agrupados en cinco áreas: tamaño del gobierno, sistema legal y derechos de propiedad, moneda sana, libertad para comerciar internacionalmente y regulación. El puntaje general es el promedio de las cinco áreas.'],
        ['¿Cómo se leen los colores?', 'Cada color reúne a <strong>una cuarta parte</strong> de las jurisdicciones medidas en el año elegido, ordenadas por puntaje: turquesa el cuartil más libre y rojo el menos libre. Los cortes cambian de un año a otro; en ' + U + ' el cuartil más libre va de <strong>' + PM.num(rq[1][0], 2) + '</strong> a ' + PM.num(rq[1][1], 2) +
          ' y el menos libre, de ' + PM.num(rq[4][0], 2) + ' a <strong>' + PM.num(rq[4][1], 2) + '</strong>. El gris marca a los territorios sin dato ese año.'],
        ['¿Por qué cambia la cantidad de países?', 'La cobertura del índice creció con el tiempo: ' + cob.join(', ') + '. ' +
          (sinAreas.length ? 'Entre ' + sinAreas[0] + ' y ' + sinAreas[sinAreas.length - 1] + ' la serie trae sólo el puntaje general, sin el desglose por áreas. ' : '') +
          'Por eso el <strong>promedio mundial</strong> de dos años distintos no compara exactamente a los mismos países. ' +
          'El mapa dibuja las fronteras actuales en todos los años: antes de 1990 algunos países tenían otras (Alemania, por ejemplo, antes de la reunificación).']
      ];
    }
  })();
  </script>
</body>
</html>
